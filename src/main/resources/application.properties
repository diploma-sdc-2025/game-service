spring.application.name=game-service
server.port=${SERVER_PORT:8080}

# HS256 signing key — MUST match auth-service (same env var or same default) or JWT validation fails and /shop returns 403.
auth.jwt.secret=${AUTH_JWT_SECRET:local-dev-hmac-sha256-secret-at-least-32-bytes-long!!}

# POST match outcome rating updates (must match auth-service INTERNAL_API_SECRET / diploma.internal-api.secret).
diploma.auth-service.url=${AUTH_SERVICE_URL:http://localhost:8080}
diploma.internal-api.secret=${INTERNAL_API_SECRET:local-dev-internal-secret}

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=20000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=30000

spring.datasource.url=jdbc:postgresql://${DB_SERVER}.postgres.database.azure.com:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway config
spring.flyway.enabled=true
spring.flyway.schemas=public
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false
spring.flyway.placeholders.APP_USER=${APP_USER}
spring.flyway.placeholders.APP_PASSWORD=${APP_PASSWORD}

logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.jdbc=DEBUG

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

logging.level.org.hibernate.SQL=warn
logging.level.org.springframework.jdbc.datasource.DataSourceUtils=warn
# Stale keys (e.g. after DB reset) can desync shop timers / battle cache. Prefixes: game:state:, game:board:,
# game:king:, game:shopPhaseEndsAt:, game:shopTimerRound:, game:battleEval:v2:
# Example (Linux/macOS): redis-cli --scan --pattern 'game:*' | xargs -r redis-cli DEL
# Matchmaking uses: matchmaking:queue, matchmaking:assigned:* — see matchmaking-service dev purge endpoint.